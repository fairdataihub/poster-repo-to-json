[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poster-to-json"
version = "0.1.0"
description = "Extract scientific poster content to machine-actionable JSON using LLMs (Ollama Llama 3.1 + Transformers Qwen2.5-VL)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "FAIRDataIHub", email = "info@fairdataihub.org" }
]
keywords = ["scientific-posters", "json", "llm", "ocr", "qwen", "llama", "datacite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "tqdm>=4.65.0",
    "ollama>=0.2.0",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
transformers = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "qwen-vl-utils>=0.0.8",
]

[project.scripts]
poster-to-json = "poster_to_json.cli:main"

[project.urls]
Homepage = "https://github.com/fairdataihub/posters-science-repo-to-json"
Documentation = "https://github.com/fairdataihub/posters-science-repo-to-json#readme"
Repository = "https://github.com/fairdataihub/posters-science-repo-to-json"
Issues = "https://github.com/fairdataihub/posters-science-repo-to-json/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/poster_to_json"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]


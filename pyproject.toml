[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poster-to-json"
version = "0.8.0"
description = "Full pipeline: scrape, QC, extract (via poster2json), and enrich scientific posters to schema-conformant JSON"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "FAIRDataIHub", email = "info@fairdataihub.org" }
]
keywords = ["scientific-posters", "json", "llm", "poster2json", "datacite", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "tqdm>=4.65.0",
    "jsonschema>=4.17.0",
    "poster2json @ git+https://github.com/fairdataihub/poster2json.git",
    "poster-scraper @ git+https://github.com/fairdataihub/poster-repo-scraper.git",
    "poster-qc @ git+https://github.com/fairdataihub/poster-repo-qc.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
poster-to-json = "poster_to_json.cli:main"

[project.urls]
Homepage = "https://github.com/fairdataihub/poster-repo-to-json"
Documentation = "https://github.com/fairdataihub/poster-repo-to-json#readme"
Repository = "https://github.com/fairdataihub/poster-repo-to-json"
Issues = "https://github.com/fairdataihub/poster-repo-to-json/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/poster_to_json"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/src/poster_to_json/poster_schema.json",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]






